<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
    <defs>
        <linearGradient id="gymBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#071126"/>
            <stop offset="50%" stop-color="#0B1B3D"/>
            <stop offset="100%" stop-color="#152B5A"/>
        </linearGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E8D19F"/>
            <stop offset="50%" stop-color="#C5A059"/>
            <stop offset="100%" stop-color="#9C7730"/>
        </linearGradient>
        <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1B2A4A"/>
            <stop offset="40%" stop-color="#D97736"/>
            <stop offset="70%" stop-color="#F59E0B"/>
            <stop offset="100%" stop-color="#0F2445"/>
        </linearGradient>
        <linearGradient id="woodFloor" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#4A2E18"/>
            <stop offset="30%" stop-color="#2D1C10"/>
            <stop offset="100%" stop-color="#1A0E07"/>
        </linearGradient>
        <radialGradient id="lightGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFF8DE" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#FFF8DE" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Base Room Structure -->
    <rect width="1200" height="675" fill="url(#gymBg)"/>

    <!-- Panoramic Sea Link Window Backdrop -->
    <g transform="translate(100, 60)">
        <!-- Window Frame -->
        <rect x="0" y="0" width="1000" height="380" rx="16" fill="url(#sunsetSky)" stroke="#C5A059" stroke-width="2" stroke-opacity="0.4"/>
        
        <!-- Distant Sea Link Bridge & City Silhouette -->
        <!-- Sea -->
        <rect x="0" y="240" width="1000" height="140" fill="#0B203E" opacity="0.9"/>
        <!-- Bridge Pylons & Cables -->
        <path d="M 120 250 L 300 242 L 520 238 L 740 240 L 900 246" stroke="#C5A059" stroke-width="3" stroke-opacity="0.7" fill="none"/>
        <line x1="380" y1="140" x2="380" y2="242" stroke="#E8D19F" stroke-width="4" stroke-opacity="0.9"/>
        <line x1="380" y1="140" x2="330" y2="242" stroke="#E8D19F" stroke-width="1.5" stroke-opacity="0.6"/>
        <line x1="380" y1="140" x2="430" y2="242" stroke="#E8D19F" stroke-width="1.5" stroke-opacity="0.6"/>
        <line x1="380" y1="140" x2="280" y2="242" stroke="#E8D19F" stroke-width="1.5" stroke-opacity="0.4"/>
        <line x1="380" y1="140" x2="480" y2="242" stroke="#E8D19F" stroke-width="1.5" stroke-opacity="0.4"/>

        <line x1="620" y1="130" x2="620" y2="240" stroke="#E8D19F" stroke-width="4" stroke-opacity="0.9"/>
        <line x1="620" y1="130" x2="560" y2="240" stroke="#E8D19F" stroke-width="1.5" stroke-opacity="0.6"/>
        <line x1="620" y1="130" x2="680" y2="240" stroke="#E8D19F" stroke-width="1.5" stroke-opacity="0.6"/>
        <line x1="620" y1="130" x2="510" y2="240" stroke="#E8D19F" stroke-width="1.5" stroke-opacity="0.4"/>
        <line x1="620" y1="130" x2="730" y2="240" stroke="#E8D19F" stroke-width="1.5" stroke-opacity="0.4"/>

        <!-- Sunset Sun Glow -->
        <circle cx="620" cy="180" r="45" fill="#FFE8A3" opacity="0.6"/>
        <circle cx="620" cy="180" r="90" fill="#FFE8A3" opacity="0.15"/>

        <!-- Window Mullions -->
        <line x1="250" y1="0" x2="250" y2="380" stroke="#071126" stroke-width="8"/>
        <line x1="500" y1="0" x2="500" y2="380" stroke="#071126" stroke-width="8"/>
        <line x1="750" y1="0" x2="750" y2="380" stroke="#071126" stroke-width="8"/>
    </g>

    <!-- Hardwood Flooring with Floor Planks Perspective -->
    <path d="M 0 420 L 1200 420 L 1200 675 L 0 675 Z" fill="url(#woodFloor)"/>
    <line x1="120" y1="420" x2="0" y2="675" stroke="#C5A059" stroke-width="1" stroke-opacity="0.15"/>
    <line x1="320" y1="420" x2="200" y2="675" stroke="#C5A059" stroke-width="1" stroke-opacity="0.15"/>
    <line x1="600" y1="420" x2="600" y2="675" stroke="#C5A059" stroke-width="1" stroke-opacity="0.15"/>
    <line x1="880" y1="420" x2="1000" y2="675" stroke="#C5A059" stroke-width="1" stroke-opacity="0.15"/>
    <line x1="1080" y1="420" x2="1200" y2="675" stroke="#C5A059" stroke-width="1" stroke-opacity="0.15"/>

    <!-- Ceiling Architectural Coffers with Ambient Cove Lighting -->
    <rect x="150" y="10" width="280" height="36" rx="8" fill="#060E1D" stroke="#C5A059" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="460" y="10" width="280" height="36" rx="8" fill="#060E1D" stroke="#C5A059" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="770" y="10" width="280" height="36" rx="8" fill="#060E1D" stroke="#C5A059" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- Technogym Running Cardio Treadmill Silhouettes & Consoles -->
    <!-- Treadmill 1 -->
    <g transform="translate(180, 420)">
        <!-- Belt Platform -->
        <polygon points="0,60 160,20 180,30 20,75" fill="#1E293B" stroke="#C5A059" stroke-width="1"/>
        <line x1="14" y1="65" x2="168" y2="26" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
        <!-- Upright Posts & Handrails -->
        <line x1="145" y1="23" x2="140" y2="-45" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
        <line x1="165" y1="28" x2="160" y2="-40" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
        <path d="M 138 -45 Q 150 -55 170 -40 L 110 -25" stroke="#94A3B8" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- LED Touch Screen Console -->
        <rect x="135" y="-70" width="35" height="24" rx="4" fill="#0F172A" stroke="#C5A059" stroke-width="1.5"/>
        <rect x="138" y="-67" width="29" height="18" rx="2" fill="#38BDF8" opacity="0.8"/>
    </g>

    <!-- Treadmill 2 -->
    <g transform="translate(390, 420)">
        <polygon points="0,60 160,20 180,30 20,75" fill="#1E293B" stroke="#C5A059" stroke-width="1"/>
        <line x1="14" y1="65" x2="168" y2="26" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
        <line x1="145" y1="23" x2="140" y2="-45" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
        <line x1="165" y1="28" x2="160" y2="-40" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
        <path d="M 138 -45 Q 150 -55 170 -40 L 110 -25" stroke="#94A3B8" stroke-width="5" fill="none" stroke-linecap="round"/>
        <rect x="135" y="-70" width="35" height="24" rx="4" fill="#0F172A" stroke="#C5A059" stroke-width="1.5"/>
        <rect x="138" y="-67" width="29" height="18" rx="2" fill="#38BDF8" opacity="0.8"/>
    </g>

    <!-- Luxury Gold Dumbbell Rack & Bench (Right Side) -->
    <g transform="translate(740, 400)">
        <!-- Rubberized Workout Mat -->
        <polygon points="0,110 380,110 420,230 -40,230" fill="#0D1627" stroke="#C5A059" stroke-width="1" stroke-opacity="0.3"/>
        <!-- Dumbbell 3-Tier Rack in Gold & Matte Black -->
        <line x1="100" y1="130" x2="340" y2="130" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
        <line x1="80" y1="170" x2="360" y2="170" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
        <!-- Rack Frame legs -->
        <line x1="100" y1="130" x2="60" y2="210" stroke="#64748B" stroke-width="7" stroke-linecap="round"/>
        <line x1="340" y1="130" x2="380" y2="210" stroke="#64748B" stroke-width="7" stroke-linecap="round"/>

        <!-- Pairs of Hexagonal Precision Dumbbells -->
        <!-- Top Tier -->
        <g transform="translate(130, 118)">
            <rect x="0" y="-8" width="10" height="16" rx="2" fill="#1E293B"/>
            <rect x="10" y="-3" width="16" height="6" fill="url(#goldGrad)"/>
            <rect x="26" y="-8" width="10" height="16" rx="2" fill="#1E293B"/>
        </g>
        <g transform="translate(180, 118)">
            <rect x="0" y="-9" width="12" height="18" rx="2" fill="#1E293B"/>
            <rect x="12" y="-3" width="16" height="6" fill="url(#goldGrad)"/>
            <rect x="28" y="-9" width="12" height="18" rx="2" fill="#1E293B"/>
        </g>
        <g transform="translate(240, 118)">
            <rect x="0" y="-11" width="14" height="22" rx="3" fill="#1E293B"/>
            <rect x="14" y="-3" width="16" height="6" fill="url(#goldGrad)"/>
            <rect x="30" y="-11" width="14" height="22" rx="3" fill="#1E293B"/>
        </g>
        <g transform="translate(300, 118)">
            <rect x="0" y="-12" width="16" height="24" rx="3" fill="#1E293B"/>
            <rect x="16" y="-3" width="16" height="6" fill="url(#goldGrad)"/>
            <rect x="32" y="-12" width="16" height="24" rx="3" fill="#1E293B"/>
        </g>

        <!-- Adjustable Workout Bench -->
        <g transform="translate(120, 180)">
            <line x1="-30" y1="20" x2="90" y2="20" stroke="#475569" stroke-width="6"/>
            <!-- Leather Padding -->
            <polygon points="-40,15 20,15 20,4 -40,4" fill="#9A3412" stroke="#C5A059" stroke-width="1"/>
            <polygon points="25,15 95,-10 90,-20 25,5" fill="#9A3412" stroke="#C5A059" stroke-width="1"/>
        </g>
    </g>

    <!-- Glass Reflection Overlays -->
    <path d="M 0 0 L 350 0 L 150 675 L 0 675 Z" fill="#FFF8DE" opacity="0.03"/>
    <path d="M 600 0 L 850 0 L 700 675 L 450 675 Z" fill="#FFF8DE" opacity="0.02"/>

    <!-- Bottom Luxury Branding Card Overlay -->
    <g transform="translate(60, 560)">
        <rect x="0" y="0" width="560" height="75" rx="20" fill="#071126" fill-opacity="0.9" stroke="#C5A059" stroke-width="1.5"/>
        <!-- Shield Icon -->
        <g transform="translate(24, 18) scale(0.75)">
            <polygon points="25,5 45,15 45,35 25,50 5,35 5,15" fill="#B91C1C" stroke="#C5A059" stroke-width="2"/>
            <circle cx="25" cy="27" r="8" fill="#FFF8DE"/>
        </g>
        <!-- Titles -->
        <text x="75" y="32" font-family="'Cinzel', serif, Georgia" font-size="16" font-weight="bold" fill="#FFF8DE" letter-spacing="1.5">
            TECHNOGYM FITNESS STUDIO
        </text>
        <text x="75" y="54" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" fill="#C5A059" letter-spacing="2">
            TONINO LAMBORGHINI RESIDENCES • BANDRA RECLAMATION
        </text>
    </g>
</svg>
