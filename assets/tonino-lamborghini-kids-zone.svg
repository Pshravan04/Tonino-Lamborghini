<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="kidsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="neonAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="goldK" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D070"/>
      <stop offset="100%" stop-color="#C5A059"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#kidsBg)"/>

  <!-- Modern Timber Floor & Acoustic Panels -->
  <polygon points="0,580 1600,580 1600,900 0,900" fill="#2E1C14" opacity="0.9"/>
  <!-- Floor perspective lines -->
  <line x1="200" y1="580" x2="-200" y2="900" stroke="#45271A" stroke-width="2"/>
  <line x1="500" y1="580" x2="300" y2="900" stroke="#45271A" stroke-width="2"/>
  <line x1="800" y1="580" x2="800" y2="900" stroke="#45271A" stroke-width="2"/>
  <line x1="1100" y1="580" x2="1300" y2="900" stroke="#45271A" stroke-width="2"/>
  <line x1="1400" y1="580" x2="1800" y2="900" stroke="#45271A" stroke-width="2"/>

  <!-- Geometric Wall Features -->
  <rect x="150" y="120" width="360" height="420" rx="24" fill="rgba(6, 182, 212, 0.12)" stroke="url(#neonCyan)" stroke-width="2"/>
  <circle cx="330" cy="270" r="80" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-dasharray="16 8"/>
  <text x="330" y="278" font-family="'Montserrat', sans-serif" font-size="20" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="3">VR &amp; GAMING</text>
  <text x="330" y="305" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">Interactive Simulator Pods</text>

  <!-- Central Play Pod Structure -->
  <rect x="580" y="80" width="440" height="460" rx="30" fill="rgba(245, 158, 11, 0.1)" stroke="url(#neonAmber)" stroke-width="2"/>
  <circle cx="800" cy="240" r="90" fill="none" stroke="url(#neonAmber)" stroke-width="3"/>
  <text x="800" y="245" font-family="'Montserrat', sans-serif" font-size="22" font-weight="800" fill="#FBBF24" text-anchor="middle" letter-spacing="3">CREATIVE ZONE</text>
  <text x="800" y="275" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" fill="#FDE68A" text-anchor="middle">Art Studio &bull; LEGO Wall &bull; Library</text>

  <!-- Toddler & Soft Play Pavilion -->
  <rect x="1090" y="120" width="360" height="420" rx="24" fill="rgba(168, 85, 247, 0.12)" stroke="#A855F7" stroke-width="2"/>
  <circle cx="1270" cy="270" r="80" fill="none" stroke="#A855F7" stroke-width="4" stroke-dasharray="16 8"/>
  <text x="1270" y="278" font-family="'Montserrat', sans-serif" font-size="20" font-weight="800" fill="#D8B4FE" text-anchor="middle" letter-spacing="3">SOFT PLAY</text>
  <text x="1270" y="305" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">Sensory Pods &bull; Ball Pit</text>

  <!-- Floating Glow Spheres -->
  <circle cx="330" cy="450" r="28" fill="#06B6D4" opacity="0.7" filter="blur(6px)"/>
  <circle cx="800" cy="450" r="32" fill="#F59E0B" opacity="0.7" filter="blur(6px)"/>
  <circle cx="1270" cy="450" r="28" fill="#A855F7" opacity="0.7" filter="blur(6px)"/>

  <!-- Header Banner -->
  <g transform="translate(450, 680)">
    <rect x="0" y="0" width="700" height="90" rx="16" fill="rgba(11, 27, 61, 0.9)" stroke="url(#goldK)" stroke-width="2"/>
    <text x="350" y="42" font-family="'Montserrat', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
      CHILDREN'S RECREATION &amp; JUNIOR ARCADE
    </text>
    <text x="350" y="68" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" fill="#F7D070" text-anchor="middle" letter-spacing="1.5">
      Tonino Lamborghini Residences &bull; Bandra Reclamation, Mumbai
    </text>
  </g>
</svg>
