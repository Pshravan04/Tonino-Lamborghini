<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08142B"/>
      <stop offset="50%" stop-color="#0B1B3D"/>
      <stop offset="100%" stop-color="#050C1D"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A2A4A"/>
      <stop offset="100%" stop-color="#0D3B66"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D070"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9C772E"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A38"/>
      <stop offset="100%" stop-color="#8E0013"/>
    </linearGradient>
    <linearGradient id="poolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(197, 160, 89, 0.08)" stroke-width="1"/>
    </pattern>
    <pattern id="dotGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <circle cx="200" cy="200" r="2" fill="rgba(197, 160, 89, 0.25)"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <rect width="1600" height="900" fill="url(#archGrid)"/>
  <rect width="1600" height="900" fill="url(#dotGrid)"/>

  <!-- Outer Architectural Border -->
  <rect x="25" y="25" width="1550" height="850" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <rect x="35" y="35" width="1530" height="830" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Left: Arabian Sea Coastline -->
  <path d="M 35 35 L 260 35 Q 240 300 290 550 T 260 865 L 35 865 Z" fill="url(#seaGrad)" opacity="0.8"/>
  <path d="M 260 35 Q 240 300 290 550 T 260 865" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="8 6"/>
  
  <!-- Sea Wave Waves -->
  <g stroke="rgba(56, 189, 248, 0.25)" fill="none" stroke-width="1.5">
    <path d="M 60 120 Q 90 110 120 120 T 180 120"/>
    <path d="M 80 240 Q 110 230 140 240 T 200 240"/>
    <path d="M 90 420 Q 120 410 150 420 T 210 420"/>
    <path d="M 70 620 Q 100 610 130 620 T 190 620"/>
    <path d="M 100 760 Q 130 750 160 760 T 220 760"/>
  </g>

  <!-- Sea Water Text -->
  <text x="130" y="320" font-family="'Montserrat', sans-serif" font-size="22" font-weight="700" fill="#38BDF8" letter-spacing="8" transform="rotate(-90, 130, 320)" opacity="0.8">
    ARABIAN SEA
  </text>
  <text x="100" y="580" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" fill="#93C5FD" letter-spacing="4" transform="rotate(-90, 100, 580)" opacity="0.7">
    LIFETIME UNHINDERED WATER VISTAS
  </text>

  <!-- Promenade Boardwalk -->
  <path d="M 265 35 Q 245 300 295 550 T 265 865" fill="none" stroke="url(#goldGrad)" stroke-width="14" opacity="0.4"/>
  <text x="250" y="470" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#F7D070" letter-spacing="3" transform="rotate(-90, 250, 470)">
    COASTAL PROMENADE &amp; ACCREDITED JOGGING TRACK
  </text>

  <!-- Main Site Boundary (Bandra Reclamation Plot) -->
  <polygon points="310,70 1250,70 1250,830 310,830" fill="rgba(255,255,255,0.02)" stroke="rgba(197, 160, 89, 0.4)" stroke-width="2"/>

  <!-- Access Roads -->
  <!-- Top Road: Reclamation Arterial -->
  <rect x="310" y="70" width="940" height="35" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)"/>
  <line x1="310" y1="87" x2="1250" y2="87" stroke="#F7D070" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.6"/>
  <text x="640" y="92" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" letter-spacing="4">
    BANDRA RECLAMATION ACCESS ROAD (30M WIDE) ➔
  </text>

  <!-- Right Road: Sea Link Connector -->
  <rect x="1215" y="70" width="35" height="760" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)"/>
  <line x1="1232" y1="70" x2="1232" y2="830" stroke="#F7D070" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.6"/>
  <text x="1238" y="450" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" letter-spacing="4" transform="rotate(90, 1238, 450)">
    DIRECT 1-MIN RAMPS TO BANDRA-WORLI SEA LINK ➔
  </text>

  <!-- Podium Deck Footprint -->
  <rect x="360" y="140" width="820" height="650" rx="30" fill="rgba(11, 27, 61, 0.6)" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Landscaped Gardens & Lawns -->
  <rect x="390" y="170" width="240" height="300" rx="16" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="510" cy="320" r="50" fill="none" stroke="#10B981" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="510" cy="320" r="14" fill="#10B981" opacity="0.4"/>
  <text x="510" y="325" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle" letter-spacing="2">
    ITALIAN PIAZZA
  </text>
  <text x="510" y="345" font-family="'Montserrat', sans-serif" font-size="9" font-weight="500" fill="#A7F3D0" text-anchor="middle">
    Sculptural Water Fountain
  </text>

  <!-- Tennis & Sports Court -->
  <rect x="390" y="500" width="240" height="260" rx="16" fill="rgba(245, 158, 11, 0.08)" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="390" y1="630" x2="630" y2="630" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="420" y="525" width="180" height="210" fill="none" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1"/>
  <text x="510" y="625" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#FCD34D" text-anchor="middle" letter-spacing="2">
    ALL-WEATHER TENNIS COURT
  </text>

  <!-- Central Master High-Rise Tower Footprint -->
  <g transform="translate(680, 200)">
    <!-- Tower Shadow -->
    <path d="M 40 40 L 440 40 L 480 380 L 0 380 Z" fill="rgba(0,0,0,0.5)" filter="blur(8px)"/>
    
    <!-- Main Tower Body (Winged Iconic High-Rise) -->
    <path d="M 60 20 
             C 180 5, 300 5, 420 20 
             C 450 140, 470 260, 480 380 
             C 320 400, 160 400, 0 380 
             C 10 260, 30 140, 60 20 Z" 
          fill="#0B1B3D" 
          stroke="url(#goldGrad)" 
          stroke-width="3"/>

    <!-- Tower Internal Core & Elevator Bank -->
    <rect x="180" y="140" width="120" height="120" rx="8" fill="#132A5E" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <text x="240" y="195" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      HIGH-SPEED
    </text>
    <text x="240" y="210" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600" fill="#F7D070" text-anchor="middle">
      PRIVATE LIFTS
    </text>

    <!-- 4 Respective Wings (3 & 4 BHK Typologies) -->
    <text x="110" y="90" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">
      WING A (4 BHK)
    </text>
    <text x="280" y="90" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">
      WING B (4 BHK)
    </text>
    <text x="60" y="330" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">
      WING C (3 BHK)
    </text>
    <text x="310" y="330" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">
      WING D (3 BHK)
    </text>

    <!-- Center Label -->
    <circle cx="240" cy="50" r="28" fill="#C5001E" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M 233 45 C 235 40 245 40 247 45 C 248 52 240 58 240 60 C 240 58 232 52 233 45 Z" fill="#FFFFFF"/>
    
    <text x="240" y="295" font-family="'Montserrat', serif" font-size="14" font-weight="700" fill="#F7D070" text-anchor="middle" letter-spacing="3">
      SIGNATURE TOWER
    </text>
    <text x="240" y="315" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600" fill="#E2E8F0" text-anchor="middle" letter-spacing="1.5">
      G + 45 STOREYS &bull; SEA-FACING DECKS
    </text>
  </g>

  <!-- Skyline Infinity Pool at Sea-Facing Front Edge -->
  <g transform="translate(680, 620)">
    <rect x="0" y="0" width="480" height="90" rx="14" fill="url(#poolGrad)" stroke="#38BDF8" stroke-width="2"/>
    <!-- Pool Ripples -->
    <line x1="20" y1="30" x2="460" y2="30" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="20 10"/>
    <line x1="40" y1="60" x2="440" y2="60" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="25 15"/>
    <text x="240" y="45" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
      SKYLINE INFINITY POOL &amp; JACUZZI (50M)
    </text>
    <text x="240" y="65" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600" fill="#E0F2FE" text-anchor="middle">
      Sunset Loungers &bull; Heated Water &bull; Cabanas
    </text>
  </g>

  <!-- Grand Drop-Off Porte Cochère -->
  <g transform="translate(720, 120)">
    <ellipse cx="200" cy="30" rx="180" ry="25" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="200" cy="30" r="16" fill="url(#goldGrad)" opacity="0.3"/>
    <text x="200" y="34" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#F7D070" text-anchor="middle" letter-spacing="2">
      VALET PORTE-COCHÈRE
    </text>
  </g>

  <!-- Entry / Exit Security Gatehouse -->
  <g transform="translate(940, 70)">
    <rect x="0" y="0" width="90" height="35" rx="4" fill="#0B1B3D" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <text x="45" y="22" font-family="'Montserrat', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      SECURITY GATE
    </text>
  </g>

  <!-- Compass Rose (North Arrow) -->
  <g transform="translate(1330, 110)">
    <circle cx="50" cy="50" r="42" fill="rgba(11,27,61,0.8)" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <!-- Star Points -->
    <polygon points="50,14 58,45 50,40" fill="#C5001E"/>
    <polygon points="50,14 42,45 50,40" fill="#FFFFFF"/>
    <polygon points="50,86 58,55 50,60" fill="rgba(255,255,255,0.4)"/>
    <polygon points="50,86 42,55 50,60" fill="rgba(255,255,255,0.2)"/>
    <polygon points="86,50 55,58 60,50" fill="rgba(255,255,255,0.4)"/>
    <polygon points="86,50 55,42 60,50" fill="rgba(255,255,255,0.2)"/>
    <polygon points="14,50 45,58 40,50" fill="rgba(255,255,255,0.4)"/>
    <polygon points="14,50 45,42 40,50" fill="rgba(255,255,255,0.2)"/>
    <text x="50" y="10" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">N</text>
  </g>

  <!-- Title Block & Project Info (Right Panel) -->
  <g transform="translate(1270, 200)">
    <rect x="0" y="0" width="280" height="590" rx="16" fill="rgba(11, 27, 61, 0.9)" stroke="url(#goldGrad)" stroke-width="2"/>
    
    <!-- Title Block Header -->
    <rect x="0" y="0" width="280" height="85" rx="16" fill="#08142B"/>
    <path d="M 0 70 L 280 70" stroke="url(#goldGrad)" stroke-width="1.5"/>
    
    <!-- Shield Icon Small -->
    <g transform="translate(20, 18) scale(0.45)">
      <path d="M 45 4 C 72 4, 82 10, 84 26 C 86 52, 70 82, 45 106 C 20 82, 4 52, 6 26 C 8 10, 18 4, 45 4 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
    </g>
    <text x="70" y="36" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="#FFFFFF">Tonino Lamborghini</text>
    <text x="70" y="52" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600" fill="#F7D070" letter-spacing="3">RESIDENCES</text>
    <text x="70" y="66" font-family="'Montserrat', sans-serif" font-size="8" font-weight="600" fill="#94A3B8">BANDRA RECLAMATION</text>

    <!-- Drawing Info -->
    <text x="20" y="105" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#F7D070" letter-spacing="1">PROJECT DETAILS</text>
    
    <text x="20" y="130" font-family="'Montserrat', sans-serif" font-size="9" font-weight="500" fill="#94A3B8">DEVELOPMENT:</text>
    <text x="20" y="145" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Ultra-Luxury Branded High-Rise</text>

    <text x="20" y="175" font-family="'Montserrat', sans-serif" font-size="9" font-weight="500" fill="#94A3B8">CONFIGURATION:</text>
    <text x="20" y="190" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">3 &amp; 4 BHK Luxury Residences</text>

    <text x="20" y="220" font-family="'Montserrat', sans-serif" font-size="9" font-weight="500" fill="#94A3B8">STARTING PRICE:</text>
    <text x="20" y="235" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#F7D070">₹8.99 Cr* + Taxes</text>

    <text x="20" y="265" font-family="'Montserrat', sans-serif" font-size="9" font-weight="500" fill="#94A3B8">LOCATION:</text>
    <text x="20" y="280" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Bandra Reclamation, Mumbai</text>

    <text x="20" y="310" font-family="'Montserrat', sans-serif" font-size="9" font-weight="500" fill="#94A3B8">MAHARERA REGISTRATION:</text>
    <text x="20" y="325" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#F7D070">A041272501874</text>

    <line x1="20" y1="345" x2="260" y2="345" stroke="rgba(255,255,255,0.15)"/>

    <!-- Legend -->
    <text x="20" y="370" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#F7D070" letter-spacing="1">MASTER PLAN LEGEND</text>

    <g font-family="'Montserrat', sans-serif" font-size="9" fill="#E2E8F0">
      <circle cx="28" cy="395" r="7" fill="#C5A059"/>
      <text x="28" y="398" font-size="8" font-weight="700" fill="#000" text-anchor="middle">1</text>
      <text x="44" y="399">Signature Tower (G+45)</text>

      <circle cx="28" cy="425" r="7" fill="#C5A059"/>
      <text x="28" y="428" font-size="8" font-weight="700" fill="#000" text-anchor="middle">2</text>
      <text x="44" y="429">Sea-Facing Infinity Pool</text>

      <circle cx="28" cy="455" r="7" fill="#C5A059"/>
      <text x="28" y="458" font-size="8" font-weight="700" fill="#000" text-anchor="middle">3</text>
      <text x="44" y="459">Italian Piazza &amp; Fountain</text>

      <circle cx="28" cy="485" r="7" fill="#C5A059"/>
      <text x="28" y="488" font-size="8" font-weight="700" fill="#000" text-anchor="middle">4</text>
      <text x="44" y="489">All-Weather Tennis Court</text>

      <circle cx="28" cy="515" r="7" fill="#C5A059"/>
      <text x="28" y="518" font-size="8" font-weight="700" fill="#000" text-anchor="middle">5</text>
      <text x="44" y="519">Valet Drop-off Porte Cochère</text>

      <circle cx="28" cy="545" r="7" fill="#C5A059"/>
      <text x="28" y="548" font-size="8" font-weight="700" fill="#000" text-anchor="middle">6</text>
      <text x="44" y="549">Private Elevator Foyers</text>
    </g>

    <rect x="20" y="565" width="240" height="15" fill="none" stroke="rgba(255,255,255,0.2)"/>
    <text x="140" y="576" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="600" fill="#94A3B8" text-anchor="middle">
      ARCHITECTURAL DRAFT &bull; NOT TO SCALED REPRODUCTION
    </text>
  </g>

</svg>
