<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" width="100%" height="100%">
    <defs>
        <linearGradient id="reraGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E8D19F"/>
            <stop offset="100%" stop-color="#C5A059"/>
        </linearGradient>
    </defs>
    <!-- Background Card -->
    <rect width="400" height="90" rx="10" fill="#FFFFFF" stroke="#0B1B3D" stroke-width="1.5"/>
    
    <!-- QR Code Graphic Area (Stylized QR Pattern) -->
    <g transform="translate(10, 8)">
        <rect width="74" height="74" fill="#FFFFFF" stroke="#C5A059" stroke-width="1" rx="4"/>
        <!-- Top Left Finder Pattern -->
        <rect x="6" y="6" width="22" height="22" fill="#0B1B3D"/>
        <rect x="10" y="10" width="14" height="14" fill="#FFFFFF"/>
        <rect x="13" y="13" width="8" height="8" fill="#0B1B3D"/>
        <!-- Top Right Finder Pattern -->
        <rect x="46" y="6" width="22" height="22" fill="#0B1B3D"/>
        <rect x="50" y="10" width="14" height="14" fill="#FFFFFF"/>
        <rect x="53" y="13" width="8" height="8" fill="#0B1B3D"/>
        <!-- Bottom Left Finder Pattern -->
        <rect x="6" y="46" width="22" height="22" fill="#0B1B3D"/>
        <rect x="10" y="50" width="14" height="14" fill="#FFFFFF"/>
        <rect x="13" y="53" width="8" height="8" fill="#0B1B3D"/>
        <!-- QR Data Modules -->
        <rect x="32" y="8" width="5" height="5" fill="#0B1B3D"/>
        <rect x="38" y="14" width="5" height="5" fill="#0B1B3D"/>
        <rect x="32" y="20" width="5" height="5" fill="#0B1B3D"/>
        <rect x="8" y="32" width="5" height="5" fill="#0B1B3D"/>
        <rect x="16" y="36" width="5" height="5" fill="#0B1B3D"/>
        <rect x="24" y="32" width="5" height="5" fill="#0B1B3D"/>
        <rect x="32" y="32" width="10" height="10" fill="#0B1B3D"/>
        <rect x="46" y="34" width="5" height="5" fill="#0B1B3D"/>
        <rect x="56" y="38" width="5" height="5" fill="#0B1B3D"/>
        <rect x="62" y="32" width="5" height="5" fill="#0B1B3D"/>
        <rect x="34" y="48" width="6" height="6" fill="#0B1B3D"/>
        <rect x="44" y="46" width="5" height="5" fill="#0B1B3D"/>
        <rect x="52" y="52" width="5" height="5" fill="#0B1B3D"/>
        <rect x="60" y="48" width="6" height="6" fill="#0B1B3D"/>
        <rect x="36" y="60" width="8" height="8" fill="#0B1B3D"/>
        <rect x="50" y="62" width="6" height="6" fill="#0B1B3D"/>
        <rect x="60" y="60" width="8" height="8" fill="#0B1B3D"/>
    </g>

    <!-- MahaRERA Details Text -->
    <g transform="translate(95, 14)">
        <rect x="0" y="0" width="120" height="18" rx="4" fill="#0B1B3D"/>
        <text x="6" y="13" font-family="'Montserrat', sans-serif" font-size="10" font-weight="bold" fill="#FFF8DE" letter-spacing="1">
            MAHARERA REGISTERED
        </text>
        
        <text x="0" y="36" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#333333">
            Agent Reg: <tspan font-weight="bold" fill="#0B1B3D">A041272501874</tspan>
        </text>

        <text x="0" y="52" font-family="'Montserrat', sans-serif" font-size="9" font-weight="500" fill="#666666">
            Project: Tonino Lamborghini Residences
        </text>

        <text x="0" y="66" font-family="'Montserrat', sans-serif" font-size="9" font-weight="bold" fill="#0B1B3D">
            maharera.mahaonline.gov.in
        </text>
    </g>
</svg>
