<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08142B"/>
      <stop offset="100%" stop-color="#0B1B3D"/>
    </linearGradient>
    <linearGradient id="goldLg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D070"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9C772E"/>
    </linearGradient>
    <linearGradient id="deckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)"/>
      <stop offset="100%" stop-color="rgba(14, 165, 233, 0.25)"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(197, 160, 89, 0.08)" stroke-width="0.75"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bpBg)"/>
  <rect width="800" height="800" fill="url(#grid)"/>

  <!-- Architectural Frame -->
  <rect x="20" y="20" width="760" height="760" fill="none" stroke="url(#goldLg)" stroke-width="2" opacity="0.7"/>
  <rect x="28" y="28" width="744" height="744" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Title Block Header -->
  <g transform="translate(45, 45)">
    <rect x="0" y="0" width="710" height="65" rx="8" fill="rgba(11,27,61,0.85)" stroke="url(#goldLg)" stroke-width="1"/>
    
    <!-- Red Shield -->
    <path d="M 28 14 C 42 14, 46 17, 47 25 C 48 38, 40 52, 28 62 C 16 52, 8 38, 9 25 C 10 17, 14 14, 28 14 Z" fill="#C5001E" stroke="#F7D070" stroke-width="1.5"/>
    <polygon points="28,24 33,36 28,33 23,36" fill="#FFFFFF"/>
    
    <text x="60" y="32" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#FFFFFF">Tonino Lamborghini Residences</text>
    <text x="60" y="48" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600" fill="#F7D070" letter-spacing="3">BANDRA RECLAMATION, MUMBAI</text>

    <!-- Typology Tag -->
    <rect x="520" y="14" width="175" height="36" rx="6" fill="#C5001E"/>
    <text x="607" y="32" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">3 BHK LUXURY</text>
    <text x="607" y="44" font-family="'Montserrat', sans-serif" font-size="9" font-weight="600" fill="#FDE047" text-anchor="middle">1,850 SQ.FT. CARPET</text>
  </g>

  <!-- Sea Facing Balcony (Top Edge - Facing Sea Link) -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="680" height="70" rx="8" fill="url(#deckGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="0" y1="68" x2="680" y2="68" stroke="#F7D070" stroke-width="2"/>
    <text x="340" y="38" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="3">
      ▲ WIDE RUNNING SEA-FACING BALCONY DECK (36'0" x 7'0") ▲
    </text>
    <text x="340" y="55" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600" fill="#BAE6FD" text-anchor="middle">
      UNOBSTRUCTED LIFETIME VIEW OF ARABIAN SEA &amp; BANDRA-WORLI SEA LINK
    </text>
  </g>

  <!-- Apartment Layout Floor Plan Walls -->
  <!-- Main Living & Dining Salon -->
  <g transform="translate(60, 205)">
    <rect x="0" y="0" width="410" height="230" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <text x="205" y="105" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
      LIVING &amp; DINING SALON
    </text>
    <text x="205" y="130" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" fill="#F7D070" text-anchor="middle">
      26'0" x 16'6"
    </text>
    <text x="205" y="150" font-family="'Montserrat', sans-serif" font-size="9" font-weight="500" fill="#94A3B8" text-anchor="middle">
      Italian Marble Flooring &bull; Double-Glazed Glass Wall
    </text>

    <!-- Furniture Outline Impressions -->
    <rect x="30" y="30" width="120" height="60" rx="4" fill="none" stroke="rgba(197, 160, 89, 0.4)" stroke-dasharray="4 2"/>
    <circle cx="90" cy="60" r="15" fill="none" stroke="rgba(197, 160, 89, 0.4)"/>
    <rect x="260" y="40" width="110" height="50" rx="4" fill="none" stroke="rgba(197, 160, 89, 0.4)" stroke-dasharray="4 2"/>
  </g>

  <!-- Master Bedroom Suite (Top Right) -->
  <g transform="translate(475, 205)">
    <rect x="0" y="0" width="265" height="230" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <text x="132" y="85" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      MASTER SUITE
    </text>
    <text x="132" y="108" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" fill="#F7D070" text-anchor="middle">
      18'0" x 14'0"
    </text>
    <!-- Walk in Closet & Master Bath -->
    <rect x="15" y="140" width="110" height="75" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="70" y="175" font-family="'Montserrat', sans-serif" font-size="9" font-weight="600" fill="#E2E8F0" text-anchor="middle">
      WALK-IN WARDROBE
    </text>
    <rect x="135" y="140" width="115" height="75" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="192" y="170" font-family="'Montserrat', sans-serif" font-size="9" font-weight="600" fill="#E2E8F0" text-anchor="middle">
      5-FIXTURE BATH
    </text>
    <text x="192" y="185" font-family="'Montserrat', sans-serif" font-size="8" font-weight="500" fill="#94A3B8" text-anchor="middle">
      Italian Marble Jacuzzi
    </text>
  </g>

  <!-- Bedroom 2 (Bottom Left) -->
  <g transform="translate(60, 440)">
    <rect x="0" y="0" width="220" height="210" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <text x="110" y="90" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      BEDROOM 2
    </text>
    <text x="110" y="112" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#F7D070" text-anchor="middle">
      14'0" x 13'0"
    </text>
    <!-- Attached Bath -->
    <rect x="15" y="140" width="190" height="55" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="110" y="172" font-family="'Montserrat', sans-serif" font-size="9" font-weight="600" fill="#E2E8F0" text-anchor="middle">
      EN-SUITE BATH (9' x 5')
    </text>
  </g>

  <!-- Bedroom 3 (Bottom Center) -->
  <g transform="translate(285, 440)">
    <rect x="0" y="0" width="220" height="210" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <text x="110" y="90" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      BEDROOM 3
    </text>
    <text x="110" y="112" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#F7D070" text-anchor="middle">
      13'0" x 12'0"
    </text>
    <!-- Attached Bath -->
    <rect x="15" y="140" width="190" height="55" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="110" y="172" font-family="'Montserrat', sans-serif" font-size="9" font-weight="600" fill="#E2E8F0" text-anchor="middle">
      EN-SUITE BATH (8' x 5')
    </text>
  </g>

  <!-- Kitchen & Private Foyer (Bottom Right) -->
  <g transform="translate(510, 440)">
    <!-- Kitchen -->
    <rect x="0" y="0" width="230" height="110" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <text x="115" y="45" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      GOURMET KITCHEN
    </text>
    <text x="115" y="65" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#F7D070" text-anchor="middle">
      13'0" x 10'0"
    </text>
    <text x="115" y="85" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="500" fill="#94A3B8" text-anchor="middle">
      Modular Italian Fittings &bull; Utility
    </text>

    <!-- Private Elevator Foyer -->
    <rect x="0" y="115" width="230" height="95" fill="rgba(197, 160, 89, 0.1)" stroke="url(#goldLg)" stroke-width="1.5"/>
    <text x="115" y="150" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#F7D070" text-anchor="middle">
      EXCLUSIVE PRIVATE FOYER
    </text>
    <text x="115" y="170" font-family="'Montserrat', sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">
      DIRECT HIGH-SPEED ELEVATOR ACCESS
    </text>
    <text x="115" y="188" font-family="'Montserrat', sans-serif" font-size="8" font-weight="500" fill="#94A3B8" text-anchor="middle">
      Biometric Smart Security
    </text>
  </g>

  <!-- Footer Spec Strip -->
  <g transform="translate(45, 675)">
    <rect x="0" y="0" width="710" height="70" rx="8" fill="#08142B" stroke="url(#goldLg)" stroke-width="1"/>
    
    <g transform="translate(25, 20)">
      <text x="0" y="14" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#94A3B8">TYPOLOGY</text>
      <text x="0" y="32" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">3 BHK RESIDENCE</text>
    </g>

    <g transform="translate(180, 20)">
      <text x="0" y="14" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#94A3B8">CARPET AREA</text>
      <text x="0" y="32" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#F7D070">1,850 SQ.FT.</text>
    </g>

    <g transform="translate(325, 20)">
      <text x="0" y="14" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#94A3B8">BALCONY DECK</text>
      <text x="0" y="32" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">SEA LINK VIEW</text>
    </g>

    <g transform="translate(470, 20)">
      <text x="0" y="14" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#94A3B8">FLOOR HEIGHT</text>
      <text x="0" y="32" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">11'8" CLEAR</text>
    </g>

    <g transform="translate(605, 20)">
      <text x="0" y="14" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#94A3B8">RERA STATUS</text>
      <text x="0" y="32" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#4ADE80">REGISTERED</text>
    </g>
  </g>
</svg>
