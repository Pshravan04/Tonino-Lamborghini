<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A38"/>
      <stop offset="50%" stop-color="#C5001E"/>
      <stop offset="100%" stop-color="#8E0013"/>
    </linearGradient>
    <linearGradient id="goldGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE59F"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9C772E"/>
    </linearGradient>
    <filter id="subtleGlowWhite" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Left: Tonino Lamborghini Shield Emblem -->
  <g transform="translate(10, 10)">
    <!-- Shield Outline & Body -->
    <path d="M 45 4 
             C 72 4, 82 10, 84 26 
             C 86 52, 70 82, 45 106 
             C 20 82, 4 52, 6 26 
             C 8 10, 18 4, 45 4 Z" 
          fill="url(#shieldGradWhite)" 
          stroke="url(#goldGradWhite)" 
          stroke-width="3" 
          filter="url(#subtleGlowWhite)"/>
    
    <!-- Inner Rim -->
    <path d="M 45 8 
             C 68 8, 77 13, 79 28 
             C 81 50, 67 76, 45 98 
             C 23 76, 9 50, 11 28 
             C 13 13, 22 8, 45 8 Z" 
          fill="none" 
          stroke="rgba(255,255,255,0.4)" 
          stroke-width="1"/>

    <!-- Stylized Charging Bull Silhouette in White/Gold -->
    <g transform="translate(24, 28) scale(0.72)" fill="#FFFFFF">
      <path d="M 28 20 C 27 17 25 14 21 13 C 18 12 16 14 17 17 C 15 15 13 14 11 15 C 9 17 11 20 13 22 C 10 21 8 23 8 25 C 9 27 13 28 17 29 C 14 31 10 35 12 39 C 14 43 18 41 21 38 C 21 42 23 48 27 52 C 29 54 31 50 31 46 C 33 48 37 53 40 55 C 42 56 43 51 40 47 C 44 46 48 43 50 39 C 51 36 49 33 46 32 C 48 30 50 27 49 24 C 47 21 42 22 38 24 C 40 18 38 12 33 11 C 30 11 29 15 28 20 Z 
               M 47 22 C 54 21 58 17 56 12 C 54 8 46 12 43 17 Z 
               M 24 13 C 24 8 18 4 15 7 C 12 10 17 15 21 16 Z"/>
    </g>
  </g>

  <!-- Right: Typography in White and Gold -->
  <g transform="translate(108, 25)">
    <!-- Tonino Lamborghini Script Style Title in Crisp White -->
    <text x="0" y="38" 
          font-family="'Playfair Display', 'Cinzel', 'Great Vibes', 'Brush Script MT', cursive, serif" 
          font-size="36" 
          font-weight="bold" 
          font-style="italic" 
          fill="#FFFFFF" 
          letter-spacing="0.5">
      Tonino Lamborghini
    </text>
    
    <!-- RESIDENCES in tracked luxury gold -->
    <text x="3" y="66" 
          font-family="'Montserrat', 'Cinzel', 'Helvetica Neue', sans-serif" 
          font-size="16" 
          font-weight="600" 
          fill="#F7D070" 
          letter-spacing="8">
      RESIDENCES
    </text>
    
    <!-- BANDRA RECLAMATION -->
    <rect x="2" y="78" width="180" height="20" rx="4" fill="rgba(255,255,255,0.12)" stroke="rgba(247,208,112,0.4)" stroke-width="1"/>
    <text x="12" y="92" 
          font-family="'Montserrat', sans-serif" 
          font-size="9" 
          font-weight="700" 
          fill="#FFFFFF" 
          letter-spacing="2.5">
      BANDRA RECLAMATION
    </text>
  </g>
</svg>
