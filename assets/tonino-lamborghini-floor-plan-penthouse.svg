    <text x="107" y="80" font-family="'Montserrat', sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      PRIVATE CIGAR &amp; WINE BAR
    </text>
    <text x="107" y="102" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#F7D070" text-anchor="middle">
      18'0" x 12'0"
    </text>
    <rect x="15" y="125" width="185" height="45" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="107" y="152" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">
      TEMPERATURE-CONTROLLED CELLAR
    </text>
