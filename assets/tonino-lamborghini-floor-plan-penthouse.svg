<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bpBgP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08142B"/>
      <stop offset="100%" stop-color="#0B1B3D"/>
    </linearGradient>
    <linearGradient id="goldLgP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D070"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9C772E"/>
    </linearGradient>
    <linearGradient id="poolGradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <pattern id="gridP" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(197, 160, 89, 0.08)" stroke-width="0.75"/>
    </pattern>
  </defs>

  <rect width="800" height="800" fill="url(#bpBgP)"/>
  <rect width="800" height="800" fill="url(#gridP)"/>

  <rect x="20" y="20" width="760" height="760" fill="none" stroke="url(#goldLgP)" stroke-width="2" opacity="0.7"/>
  <rect x="28" y="28" width="744" height="744" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Title Block Header -->
  <g transform="translate(45, 45)">
    <rect x="0" y="0" width="710" height="65" rx="8" fill="rgba(11,27,61,0.85)" stroke="url(#goldLgP)" stroke-width="1"/>
    
    <path d="M 28 14 C 42 14, 46 17, 47 25 C 48 38, 40 52, 28 62 C 16 52, 8 38, 9 25 C 10 17, 14 14, 28 14 Z" fill="#C5001E" stroke="#F7D070" stroke-width="1.5"/>
    <polygon points="28,24 33,36 28,33 23,36" fill="#FFFFFF"/>
    
    <text x="60" y="32" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#FFFFFF">Tonino Lamborghini Residences</text>
    <text x="60" y="48" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600" fill="#F7D070" letter-spacing="3">BANDRA RECLAMATION, MUMBAI</text>

    <!-- Typology Tag -->
    <rect x="470" y="14" width="225" height="36" rx="6" fill="#C5001E"/>
    <text x="582" y="32" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PRESIDENTIAL PENTHOUSE</text>
    <text x="582" y="44" font-family="'Montserrat', sans-serif" font-size="9" font-weight="600" fill="#FDE047" text-anchor="middle">CUSTOM SKY VILLA &bull; DUPLEX</text>
  </g>

  <!-- Sky Deck with Private Infinity Plunge Pool (Top) -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="680" height="85" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1.5"/>
    
    <!-- Private Plunge Pool -->
    <rect x="440" y="12" width="220" height="60" rx="8" fill="url(#poolGradP)" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="550" y="45" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      PRIVATE SKY POOL &amp; JACUZZI
    </text>

    <text x="210" y="40" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="2">
      ▲ PRIVATE ROOFTOP SKY TERRACE (42'0" x 10'0") ▲
    </text>
    <text x="210" y="58" font-family="'Montserrat', sans-serif" font-size="9" font-weight="600" fill="#BAE6FD" text-anchor="middle">
      SUNSET CABANA &bull; OUTDOOR BBQ &bull; 360° SEA LINK PANORAMA
    </text>
  </g>

  <!-- Double Height Grand Living Salon -->
  <g transform="translate(60, 225)">
    <rect x="0" y="0" width="420" height="235" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <text x="210" y="105" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
