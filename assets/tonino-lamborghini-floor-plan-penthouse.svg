    </text>
    <rect x="130" y="140" width="105" height="80" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="182" y="170" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">
      SPA BATH
    </text>
    <text x="182" y="185" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="500" fill="#94A3B8" text-anchor="middle">
      Sea View Jacuzzi
    </text>
  </g>

  <!-- Lower Level Guest Suites & Private Bar -->
  <g transform="translate(60, 470)">
    <rect x="0" y="0" width="220" height="185" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <text x="110" y="80" font-family="'Montserrat', sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">
