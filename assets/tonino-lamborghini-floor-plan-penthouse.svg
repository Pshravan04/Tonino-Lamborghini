    <text x="210" y="152" font-family="'Montserrat', sans-serif" font-size="9" font-weight="500" fill="#94A3B8" text-anchor="middle">
      Internal Glass Elevator &bull; Helical Floating Staircase
    </text>

    <!-- Spiral Staircase Graphic -->
    <circle cx="65" cy="55" r="32" fill="none" stroke="url(#goldLgP)" stroke-width="1.5" stroke-dasharray="4 2"/>
    <circle cx="65" cy="55" r="12" fill="url(#goldLgP)" opacity="0.4"/>
    <text x="65" y="58" font-family="'Montserrat', sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">STAIRS</text>
  </g>

  <!-- Sky Villa Master Wing (Top Right) -->
  <g transform="translate(490, 225)">
    <rect x="0" y="0" width="250" height="235" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <text x="125" y="85" font-family="'Montserrat', sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
