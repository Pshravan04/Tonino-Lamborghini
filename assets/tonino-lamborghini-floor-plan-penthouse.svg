    <text x="112" y="130" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="500" fill="#94A3B8" text-anchor="middle">
      Private Arrival Lobby &bull; Retinal Scan
    </text>
  </g>

  <!-- Footer Specs -->
  <g transform="translate(45, 675)">
    <rect x="0" y="0" width="710" height="70" rx="8" fill="#08142B" stroke="url(#goldLgP)" stroke-width="1"/>
    
    <g transform="translate(25, 20)">
      <text x="0" y="14" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#94A3B8">TYPOLOGY</text>
      <text x="0" y="32" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">PRESIDENTIAL SKY VILLA</text>
    </g>

    <g transform="translate(205, 20)">
      <text x="0" y="14" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#94A3B8">CARPET AREA</text>
      <text x="0" y="32" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#F7D070">CUSTOM BESPOKE</text>
    </g>

    <g transform="translate(365, 20)">
      <text x="0" y="14" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#94A3B8">SKY TERRACE</text>
      <text x="0" y="32" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">PRIVATE POOL</text>
    </g>

    <g transform="translate(500, 20)">
      <text x="0" y="14" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#94A3B8">CEILING HEIGHT</text>
      <text x="0" y="32" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">24 FT DOUBLE-HEIGHT</text>
    </g>

    <g transform="translate(630, 20)">
      <text x="0" y="14" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#94A3B8">STATUS</text>
      <text x="0" y="32" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#F7D070">BY INVITATION</text>
    </g>
  </g>
</svg>
