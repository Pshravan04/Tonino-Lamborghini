  <!-- Private Penthouse Foyer & Direct Lift -->
  <g transform="translate(515, 470)">
    <rect x="0" y="0" width="225" height="185" fill="rgba(197, 160, 89, 0.12)" stroke="url(#goldLgP)" stroke-width="1.5"/>
    <text x="112" y="85" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#F7D070" text-anchor="middle">
      DEDICATED PENTHOUSE FOYER
