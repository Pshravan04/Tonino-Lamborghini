    </text>
    <rect x="15" y="140" width="105" height="80" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="67" y="175" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">
